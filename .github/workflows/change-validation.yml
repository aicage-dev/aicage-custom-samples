name: Change Validation
run-name: Change validation (${{ github.ref_name }})

"on":
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test-agents:
    uses: ./.github/workflows/test-agents.yml

  test-base-images:
    uses: ./.github/workflows/test-base-images.yml

  test-extensions:
    uses: ./.github/workflows/test-extensions.yml

  required-status-checks:
    name: "Required Status Checks"  # do not change, used in ruleset "Required Status Checks"
    if: ${{ always() }}
    needs:
      - lint
      - test-agents
      - test-base-images
      - test-extensions
    runs-on: ubuntu-latest
    steps:
      - name: Check validation job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status \
            'all(.[]; .result == "success" or .result == "skipped")' \
            <<< "$NEEDS"
