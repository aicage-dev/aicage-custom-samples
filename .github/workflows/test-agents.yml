name: Test Agents
run-name: Test agents (${{ github.ref_name }})

"on":
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  discover-agent-matrix:
    name: Discover agent matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Generate matrix
        id: generate
        run: |
          matrix="$(scripts/generate-agent-matrix.py)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  test-agents:
    needs: discover-agent-matrix
    name: Agent ${{ matrix.agent }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-agent-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Build agent image
        run: |
          chmod +x scripts/*.sh agents/*/*.sh
          scripts/build-agent.sh \
            --agent "${{ matrix.agent }}" \
            --base-image "ghcr.io/aicage/aicage-image-base:ubuntu" \
            --image "aicage-custom-samples:test-agent-${{ matrix.agent }}"

      - name: Run agent smoke tests
        run: |
          scripts/test-agent.sh \
            --agent "${{ matrix.agent }}" \
            --image "aicage-custom-samples:test-agent-${{ matrix.agent }}"
